<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#12141c" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="8" />

  <!-- Inner Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#accent-grad)" stroke-width="4" opacity="0.3" />

  <!-- Monogram "A" and "D" combined futuristic mark -->
  <g filter="url(#glow)">
    <!-- Main Stylized 'A' shape -->
    <path d="M 160 370 L 256 140 L 305 250" fill="none" stroke="url(#accent-grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Crossbar of 'A' extending into 'D' curve -->
    <path d="M 195 290 L 310 290 C 370 290, 390 330, 370 370 C 350 400, 300 400, 240 400" fill="none" stroke="url(#accent-grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Code dot / Node -->
    <circle cx="256" cy="140" r="14" fill="#4ade80" />
  </g>
</svg>
